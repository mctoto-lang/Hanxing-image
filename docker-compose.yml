services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-hanxing-jwt-secret-change-me}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-HX2026ADMIN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-147258369}
      - FRONTEND_URL=http://localhost
      - COS_SECRET_ID=${COS_SECRET_ID:-}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-}
      - COS_BUCKET=${COS_BUCKET:-hanxing-image-1317363725}
      - COS_REGION=${COS_REGION:-ap-guangzhou}
      - COS_BASE_URL=${COS_BASE_URL:-https://hanxing-image-1317363725.cos.ap-guangzhou.myqcloud.com}
      - COS_IMAGE_PREFIX=${COS_IMAGE_PREFIX:-image/}
    volumes:
      - backend-uploads:/app/uploads
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-uploads:
  backend-data:
