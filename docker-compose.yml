services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?必须配置 JWT_SECRET 环境变量}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?必须配置 ENCRYPTION_KEY 环境变量}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-HX2026ADMIN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - COS_SECRET_ID=${COS_SECRET_ID:-}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-}
      - COS_BUCKET=${COS_BUCKET:-hanxing-image-1317363725}
      - COS_REGION=${COS_REGION:-ap-guangzhou}
      - COS_BASE_URL=${COS_BASE_URL:-https://hanxing-image-1317363725.cos.ap-guangzhou.myqcloud.com}
      - COS_IMAGE_PREFIX=${COS_IMAGE_PREFIX:-image/}
    volumes:
      - backend-uploads:/app/uploads
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  backend-uploads:
  backend-data:
